    :root {

      --co: #E9572B;  /* Definir */

      --bl: #3763A9;  /* Evaluar */

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: linear-gradient(135deg, var(--nv) 0%, var(--nv2) 100%);
      color: #fff;
      padding: 16px 24px;
      border-bottom: 4px solid var(--cy);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 700; }
    header p { margin: 4px 0 0; font-size: 0.83rem; color: #C7D7F2; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      color: #fff;
    }
    .toolbar {
      background: var(--paper);
      border-bottom: 1px solid var(--ln);
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tab-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      border: 1px solid var(--ln);
      background: #F8FAFC;
      color: var(--nv);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--nv);
      color: #fff;
      border-color: var(--nv);
    }
    .hint { font-size: 0.78rem; color: var(--mu); }
    .layout {
      display: grid;
      grid-template-columns: 1fr 410px;
      height: 66vh;
      min-height: 520px;
      border-bottom: 1px solid var(--ln);
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      #flow-wrap { height: 500px; }
    }
    #flow-wrap { width: 100%; height: 100%; background: #F8FAFC; }
    .sidebar {
      background: var(--paper);
      border-left: 1px solid var(--ln);
      padding: 18px;
      overflow-y: auto;
    }
    .sidebar h2 { margin: 0 0 6px; font-size: 1.05rem; color: var(--nv); }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      color: #fff;
    }
    .sidebar h3 {
      margin: 14px 0 6px;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--mu);
    }

    .sidebar p { margin: 0 0 8px; font-size: 0.85rem; line-height: 1.45; }
    .section-wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 22px 24px 10px;
    }
    .section-title {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--nv);
      font-weight: 700;
    }
    .path-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
      gap: 12px;
    }
    .path-step {
      background: var(--paper);
      border: 1px solid var(--ln);
      border-top: 4px solid var(--bl);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .path-step:hover { transform: translateY(-2px); }
    .path-step .step-kicker { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .path-step h4 { margin: 4px 0 6px; font-size: 0.88rem; color: var(--nv); }
    .path-step p { margin: 0; font-size: 0.78rem; color: var(--mu); line-height: 1.4; }
    .strategy {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 24px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--ln);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 6px rgba(13, 27, 51, 0.04);
    }
    .card h3 { margin: 0 0 8px; font-size: 0.98rem; color: var(--nv); }
    .card p, .card li { font-size: 0.84rem; line-height: 1.5; color: #2D3748; }
    .card ul { margin: 6px 0 0; padding-left: 18px; }
    .dt-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .dt-chip {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      color: #fff;
    }
    .rf-node-card {
      background: #fff;
      border: 2px solid var(--bl);
      border-radius: 10px;
      padding: 10px 12px;
      width: 265px;
      box-shadow: 0 4px 10px rgba(13, 27, 51, 0.08);
      cursor: pointer;
    }
    .rf-node-card.dashed { border-style: dashed; background: #F8FAFC; }
    .rf-node-card.selected { box-shadow: 0 0 0 3px rgba(0, 168, 224, 0.35); }
    .rf-node-tag { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .rf-node-title { font-size: 0.84rem; font-weight: 700; margin: 3px 0; color: var(--nv); }
    .rf-node-sub { font-size: 0.72rem; color: var(--mu); margin-bottom: 6px; }
    .rf-mod-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .rf-mod-pill {
      font-size: 0.65rem;
      background: #EEF2F7;
      color: #1E293B;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
  </style>
</head>

        role: "Cómo se construye: cierra el ciclo con trazabilidad distribuida, regresión automática de prompts, métricas DORA y cumplimiento ético/regulatorio.",
        units: ["traced_agent.py (Langfuse @observe)", "promptfooconfig.yaml (golden dataset + aserciones JSON)", "capstone/ARCHITECTURE.md + TODO.md"],
        labLink: ["modules/05-agentops-observability/", "capstone/"],
        blocks: ["Sem 1 (OBL 04 Bloque 4) + Sem 2 (ELE Bloque 4)"],
        handoff: "Sistema Full-Stack End-to-End desplegado, medible y auditable."
      }
    };

    function ModuleNode({ data, selected }) {
      return e(
        "div",
        {
          className: "rf-node-card" + (data.dashed ? " dashed" : "") + (selected ? " selected" : ""),
          style: { borderColor: data.color }
        },
        e(Handle, { type: "target", position: Position.Left, style: { background: data.color } }),
        e("div", { className: "rf-node-tag", style: { color: data.color } }, data.tag),
        e("div", { className: "rf-node-title" }, data.title),
        e("div", { className: "rf-node-sub" }, data.sub),
        e("div", { className: "rf-mod-pills" }, (data.pills || []).map((p, i) => e("span", { key: i, className: "rf-mod-pill" }, p))),
        e(Handle, { type: "source", position: Position.Right, style: { background: data.color } })
      );
    }

    const nodeTypes = { modNode: ModuleNode };

    const SUBJECT_NODES = [
      { id: "s1_datos", type: "modNode", position: { x: 20, y: 20 }, data: SUBJECTS_DATA.s1_datos },
      { id: "s1_redes", type: "modNode", position: { x: 20, y: 175 }, data: SUBJECTS_DATA.s1_redes },
      { id: "s1_elec", type: "modNode", position: { x: 20, y: 345 }, data: SUBJECTS_DATA.s1_elec },
      { id: "s1_despliegue", type: "modNode", position: { x: 355, y: 105 }, data: SUBJECTS_DATA.s1_despliegue },
      { id: "s2_ml", type: "modNode", position: { x: 690, y: 20 }, data: SUBJECTS_DATA.s2_ml },
      { id: "s2_soft", type: "modNode", position: { x: 690, y: 175 }, data: SUBJECTS_DATA.s2_soft },
      { id: "s2_elecs", type: "modNode", position: { x: 690, y: 345 }, data: SUBJECTS_DATA.s2_elecs }
    ];

    const SUBJECT_EDGES = [
      { id: "e-d-des", source: "s1_datos", target: "s1_despliegue", label: "Datasets + pgvector", animated: true, style: { stroke: "#00A8E0", strokeWidth: 2 } },
      { id: "e-r-des", source: "s1_redes", target: "s1_despliegue", label: "LLMs / LoRA / Cuantización", animated: true, style: { stroke: "#FF8A00", strokeWidth: 2 } },
      { id: "e-d-ml", source: "s1_datos", target: "s2_ml", label: "Features + Contratos", style: { stroke: "#00A8E0", strokeDasharray: "5 5" } },
      { id: "e-des-ml", source: "s1_despliegue", target: "s2_ml", label: "Métricas y validación", animated: true, style: { stroke: "#E9572B", strokeWidth: 2 } },
      { id: "e-des-sw", source: "s1_despliegue", target: "s2_soft", label: "MCP + SDD/TDD + CI/CD", animated: true, style: { stroke: "#4DB922", strokeWidth: 2 } }
    ];

    const PATH_NODES = [
      { id: "m0_datos", type: "modNode", position: { x: 20, y: 60 }, data: PATH_BUILD_DATA.m0_datos },
      { id: "m1_arch", type: "modNode", position: { x: 20, y: 230 }, data: PATH_BUILD_DATA.m1_arch },
      { id: "m2_gateway", type: "modNode", position: { x: 345, y: 60 }, data: PATH_BUILD_DATA.m2_gateway },
      { id: "m3_backend", type: "modNode", position: { x: 345, y: 230 }, data: PATH_BUILD_DATA.m3_backend },
      { id: "m4_ux", type: "modNode", position: { x: 675, y: 60 }, data: PATH_BUILD_DATA.m4_ux },
      { id: "m5_ops", type: "modNode", position: { x: 675, y: 230 }, data: PATH_BUILD_DATA.m5_ops }
    ];

    const PATH_EDGES = [
      { id: "p-0-2", source: "m0_datos", target: "m2_gateway", label: "Contratos + Datos", animated: true, style: { stroke: "#00A8E0", strokeWidth: 2 } },
      { id: "p-1-3", source: "m1_arch", target: "m3_backend", label: "Ports + SDD/TDD", animated: true, style: { stroke: "#4DB922", strokeWidth: 2 } },
      { id: "p-2-3", source: "m2_gateway", target: "m3_backend", label: "LiteLLM / vLLM", animated: true, style: { stroke: "#FF8A00", strokeWidth: 2 } },
      { id: "p-3-4", source: "m3_backend", target: "m4_ux", label: "SSE + HITL", animated: true, style: { stroke: "#3763A9", strokeWidth: 2 } },
      { id: "p-4-5", source: "m4_ux", target: "m5_ops", label: "Trazas + Regresión", animated: true, style: { stroke: "#E9572B", strokeWidth: 2 } },
      { id: "p-3-5", source: "m3_backend", target: "m5_ops", label: "Langfuse + Promptfoo", style: { stroke: "#0D1B33", strokeDasharray: "4 4" } }
    ];

    function App() {
      const [view, setView] = React.useState("subjects");
      const [selectedId, setSelectedId] = React.useState("s1_despliegue");

      const handleSwitchView = (nextView) => {
        setView(nextView);
        setSelectedId(nextView === "subjects" ? "s1_despliegue" : "m3_backend");
      };

      const dataMap = view === "subjects" ? SUBJECTS_DATA : PATH_BUILD_DATA;
      const active = dataMap[selectedId] || Object.values(dataMap)[0];
      const nodes = (view === "subjects" ? SUBJECT_NODES : PATH_NODES).map((n) => ({
        ...n,
        selected: n.id === selectedId
      }));
      const edges = view === "subjects" ? SUBJECT_EDGES : PATH_EDGES;

      return e(
        React.Fragment,
        null,
        e(
          "div",
          { className: "toolbar" },
          e(
            "div",
            { className: "tab-group" },
            e("button", {
              type: "button",
              className: "tab-btn" + (view === "subjects" ? " active" : ""),
              onClick: () => handleSwitchView("subjects")
            }, "Vista 1 · Módulos por Asignatura (Sem 1 y Sem 2)"),
            e("button", {
              type: "button",
              className: "tab-btn" + (view === "path" ? " active" : ""),
              onClick: () => handleSwitchView("path")
            }, "Vista 2 · Cómo se construye el Path (M0 → M5 + Capstone)")
          ),
          e("span", { className: "hint" }, "Haz clic en cualquier nodo para inspeccionar sus módulos oficiales, bloques 12+4 y entregables.")
        ),
        e(
          "div",
          { className: "layout" },
          e(
            "div",
            { id: "flow-wrap" },
            e(
              ReactFlowComp,
              {
                key: view,
                nodes,
                edges,
                nodeTypes,
                fitView: true,
                onNodeClick: (_, node) => setSelectedId(node.id)
              },
              e(Background, { gap: 18, color: "#E2E8F0" }),
              e(Controls, null),
              e(MiniMap, { nodeColor: (n) => (n.data && n.data.color) || "#3763A9" })
            )
          ),
          e(
            "aside",
            { className: "sidebar" },
            e("span", { className: "badge", style: { background: active.color } }, active.tag),
            e("h2", null, active.title),
            e("p", null, active.role),
            e("h3", null, view === "subjects" ? "Módulos oficiales de la asignatura" : "Artefactos que se construyen"),
            e("ul", null, active.units.map((u, i) => e("li", { key: i }, u))),
            e("h3", null, "Acoplamiento con fullstack-ai-agents-lab"),
            e("ul", null, active.labLink.map((m, i) => e("li", { key: i }, m))),
            e("h3", null, "Cadencia 12+4 semanas (3 h/sem)"),
            e("ul", null, active.blocks.map((b, i) => e("li", { key: i }, b))),
            e("h3", null, "Aporte al Path"),
            e("p", { style: { fontWeight: 600, color: "#0D1B33" } }, active.handoff)
          )
        ),
        e(
          "section",
          { className: "section-wrap" },
          e("h3", { className: "section-title" }, "Construcción Progresiva del Path (clic para inspeccionar en Vista 2)"),
          e(
            "div",
            { className: "path-strip" },
            Object.entries(PATH_BUILD_DATA).map(([id, item]) =>
              e(
                "div",
                {
                  key: id,
                  className: "path-step",
                  style: { borderTopColor: item.color },
                  onClick: () => {
                    setView("path");
                    setSelectedId(id);
                  }
                },
                e("div", { className: "step-kicker", style: { color: item.color } }, item.tag),
                e("h4", null, item.title),
                e("p", null, item.sub + " · " + item.handoff)
              )
            )
          )
        ),
        e(
          "section",
          { className: "strategy" },
          e(
            "div",
            { className: "card" },
            e("h3", null, "1. Aprendizaje Profundo Verificable"),
            e("p", null, "Evita la descarga cognitiva al trabajar con IA fortaleciendo tres dimensiones independientes:"),
            e("ul", null,
              e("li", null, e("strong", null, "Motivación: "), "problemas reales de despliegue con agencia del aprendiz."),
              e("li", null, e("strong", null, "Argumentación: "), "justificar trade-offs (latencia, VRAM, costo, riesgo) con trazas reales."),
              e("li", null, e("strong", null, "Resolución de problemas: "), "construir desde cero, depurar y validar con pruebas.")
            )
          ),
          e(
            "div",
            { className: "card" },
            e("h3", null, "2. Diseño Ágil para Adultos (3 h/sem)"),
            e("p", null, "Basado en Andragogía, Worked Examples y Retrieval Practice:"),
            e("ul", null,
              e("li", null, e("strong", null, "Clase de 3 h: "), "máx. 60 min magistrales + 120 min de interacción ABP."),
              e("li", null, e("strong", null, "Consulta asíncrona: "), "video ≤3 min, infografía, mapa mental y 5 tarjetas."),
              e("li", null, e("strong", null, "Evaluación: "), "predecir salidas no obvias, detectar fallos y guiar sin dar la respuesta.")
            )
          ),
          e(
            "div",
            { className: "card" },
            e("h3", null, "3. Paleta Design Thinking + Cadencia 12+4"),
            e("p", null, "Cada materia del path cumple 48 HAP en 4 bloques 3+1 (S1–S3→S4, S5–S7→S8, S9–S11→S12, S13–S15→S16):"),
            e("div", { className: "dt-grid" },
              e("span", { className: "dt-chip", style: { background: "#00A8E0" } }, "Empatizar: caso roto"),
              e("span", { className: "dt-chip", style: { background: "#E9572B" } }, "Definir: spec SDD"),
              e("span", { className: "dt-chip", style: { background: "#4DB922" } }, "Idear: arquitectura"),
              e("span", { className: "dt-chip", style: { background: "#FF8A00" } }, "Prototipar: código + MCP"),
              e("span", { className: "dt-chip", style: { background: "#3763A9" } }, "Evaluar: trazas + defensa")
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
