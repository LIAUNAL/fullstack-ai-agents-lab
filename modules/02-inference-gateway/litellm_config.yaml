model_list:
  - model_name: agent-default
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: os.environ/OLLAMA_BASE_URL
      timeout: 30
    model_info:
      description: "Modelo local primario para desarrollo y baja latencia"

  - model_name: agent-default
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30

  - model_name: agent-reasoning
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 45

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - {"agent-default": ["agent-reasoning"]}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
